name: release

on:
  push:
    tags:
      - "v*"
      - "go/v*"
  workflow_dispatch:

jobs:
  npm:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'go/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: "@kinex-ai"
      - run: npm ci
      - name: Tag matches package.json
        if: startsWith(github.ref_name, 'v')
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.ref_name }}"
      - run: node scripts/check-secrets.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Publish to npmjs.com (skipped when this version is already on the registry)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published; skipping"
          else
            npm publish --access public --provenance
          fi

  go:
    if: startsWith(github.ref_name, 'go/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: npm
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.ref_name, 'go/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GOPRIVATE: github.com/kinex-ai-space/*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stage the published tarball (same bytes, same integrity as the lockfiles)
        run: |
          mkdir -p sdk-out/npm
          cd sdk-out/npm
          npm pack "@kinex-ai/workspace-sdk@${{ steps.version.outputs.value }}"
      - name: Stage the Go module as a GOPROXY layout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          seed="$(mktemp -d)"
          printf 'module seed\n\ngo 1.25.0\n' > "$seed/go.mod"
          (cd "$seed" && GOMODCACHE="$seed/mod" go get "github.com/kinex-ai-space/kin-workspace-sdk/go@go/v${{ steps.version.outputs.value }}")
          mkdir -p sdk-out/go-proxy
          cp -R "$seed/mod/cache/download/github.com" sdk-out/go-proxy/github.com
          git config --global --unset-all url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf
      - run: echo "${{ steps.version.outputs.value }}" > sdk-out/VERSION
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sdk
          push: true
          tags: ghcr.io/kinex-ai-space/workspace-sdk:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/kinex-ai-space/kin-workspace-sdk

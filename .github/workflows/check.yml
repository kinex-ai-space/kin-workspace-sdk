name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Public repository check (secrets, internal hosts, emails, commit identities)
        run: node scripts/check-public.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
